# Cross-phase: IaaS infrastructure (VMs, SQL Server) used by Phase 1 and testing
name: Deploy IaaS Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/bicep/iaas/**'
      - '.github/workflows/deploy-iaas.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/bicep/iaas/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        default: 'dev'
      vm_size:
        description: 'VM size'
        required: false
        default: 'Standard_D2ds_v6'
      sql_vm_size:
        description: 'SQL VM size'
        required: false
        default: 'Standard_D4ds_v6'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Core dependency outputs
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          az deployment sub show \
            --name "jobsite-core-${ENVIRONMENT}" \
            --query "properties.outputs" \
            -o json > core-outputs.json

          echo "CORE_RESOURCE_GROUP=$(jq -r '.resourceGroupName.value' core-outputs.json)" >> "$GITHUB_ENV"
          echo "CORE_VNET_NAME=$(jq -r '.vnetName.value' core-outputs.json)" >> "$GITHUB_ENV"

      - name: Deploy IaaS Infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
            VM_SIZE="${{ github.event.inputs.vm_size || 'Standard_D2ds_v6' }}"
            SQL_VM_SIZE="${{ github.event.inputs.sql_vm_size || 'Standard_D4ds_v6' }}"
            
            az deployment sub create \
              --name "jobsite-iaas-${ENVIRONMENT}" \
              --location "swedencentral" \
              --template-file "./infrastructure/bicep/iaas/main.bicep" \
              --parameters \
                environment="$ENVIRONMENT" \
                vmSize="$VM_SIZE" \
                sqlVmSize="$SQL_VM_SIZE" \
                coreResourceGroupName="$CORE_RESOURCE_GROUP" \
                coreVnetName="$CORE_VNET_NAME"

      - name: Get IaaS outputs
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          az deployment sub show \
            --name "jobsite-iaas-${ENVIRONMENT}" \
            --query "properties.outputs" \
            -o json > iaas-outputs.json

          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg resourceGroup "$(jq -r '.resourceGroupName.value' iaas-outputs.json)" \
            --arg loadBalancerPublicIp "$(jq -r '.loadBalancerPublicIp.value' iaas-outputs.json)" \
            --arg loadBalancerFqdn "$(jq -r '.loadBalancerFqdn.value' iaas-outputs.json)" \
            --arg wfeVmName "$(jq -r '.wfeVmName.value' iaas-outputs.json)" \
            --arg sqlVmName "$(jq -r '.sqlVmName.value' iaas-outputs.json)" \
            --arg sqlVmPrivateIp "$(jq -r '.sqlVmPrivateIp.value' iaas-outputs.json)" \
            '{
              environment: $environment,
              resourceGroupName: $resourceGroup,
              webEndpoint: {
                loadBalancerPublicIp: $loadBalancerPublicIp,
                loadBalancerFqdn: $loadBalancerFqdn
              },
              vmDependencies: {
                wfeVmName: $wfeVmName,
                sqlVmName: $sqlVmName,
                sqlVmPrivateIp: $sqlVmPrivateIp
              }
            }' > iaas-dependencies.json
        id: iaas-output

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: iaas-deployment-outputs-${{ github.event.inputs.environment || 'dev' }}
          path: |
            iaas-outputs.json
            iaas-dependencies.json
          retention-days: 30
