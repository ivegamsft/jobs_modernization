# Phase 1 specific: Deploys legacy .NET 4.8 app to IaaS VMs
# Phase 2+ will require separate deploy workflows for modernized apps
name: Deploy Phase 1 App to IaaS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        default: 'dev'
      build_run_id:
        description: 'Optional build workflow run ID (required for manual deploy artifact download)'
        required: false
        default: ''
  workflow_run:
    workflows: ["Build Phase 1 Legacy Web"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate build run ID for manual trigger
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and [string]::IsNullOrWhiteSpace("${{ github.event.inputs.build_run_id }}")) {
            throw "For workflow_dispatch, provide build_run_id from 'Build Phase 1 Legacy Web' run."
          }

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jobsiteweb-build
          path: ./app-build/
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get IaaS deployment outputs
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          az deployment sub show \
            --name "jobsite-iaas-${ENVIRONMENT}" \
            --query "properties.outputs" \
            -o json > iaas-outputs.json

      - name: Export dependency contract
        shell: pwsh
        run: |
          $outputFile = Get-Content -Path "iaas-outputs.json" | ConvertFrom-Json
          $environment = "${{ github.event.inputs.environment || 'dev' }}"

          $dependency = @{
            environment = $environment
            resourceGroupName = $outputFile.resourceGroupName.value
            wfeVmName = $outputFile.wfeVmName.value
            sqlVmName = $outputFile.sqlVmName.value
            webEndpoint = @{
              loadBalancerPublicIp = $outputFile.loadBalancerPublicIp.value
              loadBalancerFqdn = $outputFile.loadBalancerFqdn.value
            }
            requiredIaasSecrets = @(
              "VM_ADMIN_USERNAME",
              "VM_ADMIN_PASSWORD"
            )
          } | ConvertTo-Json -Depth 5

          $dependency | Out-File -FilePath "phase1-app-iaas-dependencies.json" -Encoding utf8

      - name: Upload app dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-app-iaas-dependencies-${{ github.event.inputs.environment || 'dev' }}
          path: phase1-app-iaas-dependencies.json
          retention-days: 30

      - name: Deploy to IIS on VMs
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.VM_ADMIN_USERNAME }}") -or [string]::IsNullOrWhiteSpace("${{ secrets.VM_ADMIN_PASSWORD }}")) {
            throw "Missing required secrets VM_ADMIN_USERNAME and/or VM_ADMIN_PASSWORD for IaaS app deployment."
          }

          $outputFile = Get-Content -Path "iaas-outputs.json" | ConvertFrom-Json
          $vmIps = @($outputFile.loadBalancerPublicIp.value)
          $appPath = "C:\inetpub\wwwroot\JobSiteWeb"

          $securePassword = ConvertTo-SecureString "${{ secrets.VM_ADMIN_PASSWORD }}" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential ("${{ secrets.VM_ADMIN_USERNAME }}", $securePassword)
          
          foreach ($vmIp in $vmIps) {
            Write-Host "Deploying to VM: $vmIp"
            
            $session = New-PSSession -ComputerName $vmIp -Credential $credential
            
            Copy-Item -Path "./app-build/*" -Destination $appPath -ToSession $session -Recurse -Force
            
            # Reset IIS application pool
            Invoke-Command -Session $session -ScriptBlock {
              Restart-WebAppPool -Name "JobSiteWeb"
            }
            
            Remove-PSSession -Session $session
          }
        shell: pwsh

      - name: Verify deployment
        run: |
          $outputFile = Get-Content -Path "iaas-outputs.json" | ConvertFrom-Json
          $vmIps = @($outputFile.loadBalancerPublicIp.value)
          
          foreach ($vmIp in $vmIps) {
            Write-Host "Checking deployment on $vmIp..."
            $response = Invoke-WebRequest -Uri "http://$vmIp/JobSiteWeb" -SkipHttpErrorCheck
            Write-Host "Response Status: $($response.StatusCode)"
          }
        shell: pwsh
