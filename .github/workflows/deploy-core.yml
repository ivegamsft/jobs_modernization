# Cross-phase: Core infrastructure (networking, ACR, Key Vault) used by all phases
name: Deploy Core Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/bicep/core/**'
      - '.github/workflows/deploy-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/bicep/core/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        default: 'dev'
      location:
        description: 'Azure region'
        required: true
        default: 'swedencentral'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Core Resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
            LOCATION="${{ github.event.inputs.location || 'swedencentral' }}"
            
            az deployment sub create \
              --name "jobsite-core-${ENVIRONMENT}" \
              --location "$LOCATION" \
              --template-file "./infrastructure/bicep/core/main.bicep" \
              --parameters \
                environment="$ENVIRONMENT" \
                location="$LOCATION"

      - name: Get deployment outputs
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          az deployment sub show \
            --name "jobsite-core-${ENVIRONMENT}" \
            --query "properties.outputs" \
            -o json > core-outputs.json

          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg resourceGroupName "$(jq -r '.resourceGroupName.value' core-outputs.json)" \
            --arg vnetName "$(jq -r '.vnetName.value' core-outputs.json)" \
            --arg peSubnetId "$(jq -r '.peSubnetId.value' core-outputs.json)" \
            --arg containerAppsSubnetId "$(jq -r '.containerAppsSubnetId.value' core-outputs.json)" \
            --arg logAnalyticsWorkspaceId "$(jq -r '.logAnalyticsWorkspaceId.value' core-outputs.json)" \
            '{
              environment: $environment,
              resourceGroupName: $resourceGroupName,
              requiredByDownstream: {
                coreResourceGroupName: $resourceGroupName,
                coreVnetName: $vnetName,
                peSubnetId: $peSubnetId,
                containerAppsSubnetId: $containerAppsSubnetId,
                logAnalyticsWorkspaceId: $logAnalyticsWorkspaceId
              }
            }' > core-dependencies.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: core-deployment-outputs-${{ github.event.inputs.environment || 'dev' }}
          path: |
            core-outputs.json
            core-dependencies.json
          retention-days: 30
