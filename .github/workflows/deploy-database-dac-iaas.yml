# Cross-phase: Database deployment to IaaS SQL Server
# Uses database-dacpac artifact from build-database-dacpac workflow
name: Deploy Database to IaaS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        default: 'dev'
      build_run_id:
        description: 'Optional DACPAC build run ID (required for manual deploy artifact download)'
        required: false
        default: ''
  workflow_run:
    workflows: ["Build Database DACPAC"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate build run ID for manual trigger
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and [string]::IsNullOrWhiteSpace("${{ github.event.inputs.build_run_id }}")) {
            throw "For workflow_dispatch, provide build_run_id from 'Build Database DACPAC' run."
          }

      - name: Download DACPAC artifact
        uses: actions/download-artifact@v4
        with:
          name: database-dacpac
          path: ./dacpac/
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get IaaS deployment outputs
        run: |
          $ENVIRONMENT = "${{ github.event.inputs.environment || 'dev' }}"
          az deployment sub show `
            --name "jobsite-iaas-$ENVIRONMENT" `
            --query "properties.outputs" `
            -o json | Out-File -FilePath "iaas-outputs.json"

      - name: Export database dependency contract
        shell: pwsh
        run: |
          $outputFile = Get-Content -Path "iaas-outputs.json" | ConvertFrom-Json
          $dependency = @{
            environment = "${{ github.event.inputs.environment || 'dev' }}"
            sqlVmName = $outputFile.sqlVmName.value
            sqlVmPrivateIp = $outputFile.sqlVmPrivateIp.value
            requiredSecrets = @("SQL_ADMIN_PASSWORD")
          } | ConvertTo-Json -Depth 5

          $dependency | Out-File -FilePath "database-iaas-dependencies.json" -Encoding utf8

      - name: Upload database dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-iaas-dependencies-${{ github.event.inputs.environment || 'dev' }}
          path: database-iaas-dependencies.json
          retention-days: 30

      - name: Install SqlPackage
        run: |
          choco install sqlpackage -y

      - name: Deploy DACPAC to SQL Server VM
        run: |
          $outputFile = Get-Content -Path "iaas-outputs.json" | ConvertFrom-Json
          $sqlVmIp = $outputFile.sqlVmPrivateIp.value
          $dacFiles = Get-ChildItem -Path "./dacpac" -Filter "*.dacpac" -Recurse
          
          foreach ($dacFile in $dacFiles) {
            Write-Host "Deploying DACPAC: $($dacFile.Name) to $sqlVmIp"
            
            $connectionString = "Server=$sqlVmIp;User Id=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=false;"
            
            # Using SqlPackage to deploy dacpac
            SqlPackage /Action:Publish `
              /SourceFile:"$($dacFile.FullName)" `
              /TargetConnectionString:"$connectionString" `
              /TargetDatabaseName:"JobsiteDb" `
              /p:RegisterDataTierApplication=true `
              /p:AllowIncompatiblePlatform=true
          }
        shell: pwsh

      - name: Verify database deployment
        run: |
          $outputFile = Get-Content -Path "iaas-outputs.json" | ConvertFrom-Json
          $sqlVmIp = $outputFile.sqlVmPrivateIp.value
          $connectionString = "Server=$sqlVmIp;User Id=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=false;"
          
          $connection = New-Object System.Data.SqlClient.SqlConnection
          $connection.ConnectionString = $connectionString
          $connection.Open()
          
          $command = $connection.CreateCommand()
          $command.CommandText = "SELECT @@version"
          $result = $command.ExecuteScalar()
          
          Write-Host "Database connection successful: $result"
          $connection.Close()
        shell: pwsh
