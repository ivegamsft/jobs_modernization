name: Build Database DACPAC

on:
  push:
    branches: [main, develop]
    paths:
      - 'database/**'
      - '.github/workflows/build-database-dacpac.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'database/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DACPAC
        run: |
          if (Test-Path "database/JobsDB") {
            $sqlprojFile = Get-ChildItem -Path "database/JobsDB" -Filter "*.sqlproj" | Select-Object -First 1
            if ($sqlprojFile) {
              $classicExit = 0
              msbuild $sqlprojFile.FullName /p:Configuration=Debug /p:Platform=AnyCPU
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Classic SSDT build failed (exit $LASTEXITCODE). Trying NetCoreBuild fallback."
                dotnet build $sqlprojFile.FullName /p:Configuration=Debug /p:Platform=AnyCPU /p:NetCoreBuild=true
                if ($LASTEXITCODE -ne 0) {
                  throw "Both classic and NetCoreBuild SQL project builds failed"
                }
              }
            } else {
              throw "No .sqlproj file found under database/JobsDB"
            }
          } else {
            throw "Path database/JobsDB not found"
          }
        shell: pwsh

      - name: Find DACPAC file
        run: |
          $dacFile = Get-ChildItem -Path "database" -Filter "*.dacpac" -Recurse | Select-Object -First 1
          if ($dacFile) {
            echo "DACPAC_PATH=$($dacFile.FullName)" >> $env:GITHUB_OUTPUT
            echo "DACPAC_NAME=$($dacFile.Name)" >> $env:GITHUB_OUTPUT
          } else {
            throw "No .dacpac produced by build"
          }
        id: find-dacpac
        shell: pwsh

      - name: Upload DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: database/**/*.dacpac
          retention-days: 30

      - name: Set output
        run: |
          echo "DACPAC_NAME=${{ steps.find-dacpac.outputs.DACPAC_NAME }}" >> $env:GITHUB_OUTPUT
          echo "DACPAC_PATH=${{ steps.find-dacpac.outputs.DACPAC_PATH }}" >> $env:GITHUB_OUTPUT
        id: dacpac
