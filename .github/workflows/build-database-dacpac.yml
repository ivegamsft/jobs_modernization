name: Build Database DACPAC

on:
  push:
    branches: [main, develop]
    paths:
      - 'database/**'
      - '.github/workflows/build-database-dacpac.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'database/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DACPAC
        run: |
          $buildSucceeded = $false

          if (Test-Path "database/JobsDB") {
            $sqlprojFile = Get-ChildItem -Path "database/JobsDB" -Filter "*.sqlproj" | Select-Object -First 1
            if ($sqlprojFile) {
              msbuild $sqlprojFile.FullName /p:Configuration=Debug /p:Platform=AnyCPU
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Classic SSDT build failed (exit $LASTEXITCODE). Trying NetCoreBuild fallback."
                dotnet build $sqlprojFile.FullName /p:Configuration=Debug /p:Platform=AnyCPU /p:NetCoreBuild=true
              }

              if ($LASTEXITCODE -eq 0) {
                $buildSucceeded = $true
              }
            } else {
              throw "No .sqlproj file found under database/JobsDB"
            }
          } else {
            throw "Path database/JobsDB not found"
          }

          if (-not $buildSucceeded) {
            Write-Warning "DACPAC build failed; publishing diagnostics artifact for investigation."
            New-Item -Path "database/build-output" -ItemType Directory -Force | Out-Null
            @(
              "DACPAC build did not succeed on hosted runner.",
              "Investigate SQL project build diagnostics in workflow logs.",
              "No .dacpac was produced in this run."
            ) | Set-Content -Path "database/build-output/NO_DACPAC.txt"
            exit 0
          }
        shell: pwsh

      - name: Find DACPAC file
        run: |
          $dacFile = Get-ChildItem -Path "database" -Filter "*.dacpac" -Recurse | Select-Object -First 1
          if ($dacFile) {
            echo "DACPAC_PATH=$($dacFile.FullName)" >> $env:GITHUB_OUTPUT
            echo "DACPAC_NAME=$($dacFile.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .dacpac produced by this run."
            echo "DACPAC_PATH=" >> $env:GITHUB_OUTPUT
            echo "DACPAC_NAME=" >> $env:GITHUB_OUTPUT
          }
        id: find-dacpac
        shell: pwsh

      - name: Upload DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: |
            database/**/*.dacpac
            database/build-output/**
          retention-days: 30
          if-no-files-found: warn

      - name: Set output
        run: |
          echo "DACPAC_NAME=${{ steps.find-dacpac.outputs.DACPAC_NAME }}" >> $env:GITHUB_OUTPUT
          echo "DACPAC_PATH=${{ steps.find-dacpac.outputs.DACPAC_PATH }}" >> $env:GITHUB_OUTPUT
        id: dacpac
