name: Build JobsSiteWeb

on:
  push:
    branches: [main, develop]
    paths:
      - 'phase1-legacy-baseline/appV1.5-buildable/**'
      - '.github/workflows/build-jobsiteweb.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'phase1-legacy-baseline/appV1.5-buildable/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: |
          nuget restore phase1-legacy-baseline/appV1.5-buildable/JobsSiteWeb.csproj -SolutionDirectory phase1-legacy-baseline/appV1.5-buildable

      - name: Build and publish web project
        shell: pwsh
        run: |
          $publishDir = Join-Path $PWD "publish"
          msbuild phase1-legacy-baseline/appV1.5-buildable/JobsSiteWeb.csproj `
            /p:Configuration=Debug `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$publishDir"

          if (!(Test-Path $publishDir)) {
            throw "Publish output folder not found: $publishDir"
          }

          $publishedFiles = Get-ChildItem -Path $publishDir -Recurse -File
          if ($publishedFiles.Count -eq 0) {
            throw "Publish output is empty"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jobsiteweb-build
          path: ./publish/
          retention-days: 30

      - name: Set build output
        run: |
          echo "BUILD_ARTIFACT_PATH=./publish" >> $env:GITHUB_OUTPUT
          echo "BUILD_VERSION=$(Get-Date -Format 'yyyyMMddHHmmss')" >> $env:GITHUB_OUTPUT
        id: build
